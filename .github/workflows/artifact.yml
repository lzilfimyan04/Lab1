name: Hello.cpp Artifact Workflow

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v8

      - name: Install g++
        run: sudo apt update && sudo apt install -y g++

      - name: Compile hello.cpp
        run: g++ hello.cpp -o hello

      - name: Upload artifact
        uses: actions/upload-artifact@v8
        with:
          name: hello-program
          path: hello

  run:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: hello-program

      - name: Make executable runnable
        run: chmod +x hello

      - name: Run program
        run: ./hello
