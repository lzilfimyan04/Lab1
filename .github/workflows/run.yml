name: Build C++ Hello

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '*/2 * * * *'
    issues:
    types:
      - opened
      - closed


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install g++
      run: sudo apt-get update && sudo apt-get install -y g++

    - name: Compile hello.cpp
      run: g++ -std=c++17 hello.cpp -o hello

    - name: Run program
      run: ./hello
