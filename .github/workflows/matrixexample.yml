name: Matrix Hello Example

on:
  workflow_dispatch

jobs:
  build-and-run:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-22.04]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile program
        run: g++ hello.cpp -o hello

      - name: Run program
        run: ./hello
